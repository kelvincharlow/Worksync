spring.config.import=optional:file:.env[.properties]
spring.application.name=worksync
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:worksync}}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
server.error.include-message=never
server.error.include-stacktrace=never
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=worksync-api
app.jwt.expiration-seconds=900
spring.profiles.include=email
# Comma-separated exact browser origins; Render must explicitly include approved deployed frontends.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5000,http://127.0.0.1:5000}
# Trust forwarded headers only through Spring's secure proxy strategy
server.forward-headers-strategy=framework
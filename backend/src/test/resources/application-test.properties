spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/worksync_test}
spring.datasource.username=${TEST_DB_USER:worksync_test}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Do not import private credentials or contact SMTP in automated tests.
spring.config.import=
spring.mail.host=smtp.example.invalid
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.test-connection=false
spring.mail.properties[mail.debug]=false
worksync.email.from=security@example.invalid
logging.level.root=WARN
logging.level.org.springframework.web=OFF
logging.level.org.springframework.security=OFF
logging.level.org.hibernate.SQL=OFF

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: worksync_test
          POSTGRES_USER: worksync_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worksync_test -d worksync_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/worksync_test
      TEST_DB_USER: worksync_test
      TEST_DB_PASSWORD: ci-disposable-only
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Initialize Maven Wrapper (retry transient downloads)
        timeout-minutes: 5
        working-directory: backend
        run: |
          for attempt in 1 2 3; do
            if MVNW_VERBOSE=true ./mvnw --version; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Maven Wrapper initialization failed after 3 attempts."
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
      - run: ./mvnw --batch-mode verify
        working-directory: backend
      - run: docker compose --env-file .env.example config --quiet
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore frontend/Worksync.Frontend.csproj
      - run: dotnet build frontend/Worksync.Frontend.csproj -c Release --no-restore
      - run: dotnet publish frontend/Worksync.Frontend.csproj -c Release --no-build

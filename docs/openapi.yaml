  /projects/{projectId}/delivery-progress:
    get:
      tags:
      - Work Items
      operationId: getClientDeliveryProgress
      summary: Read client-safe progress aggregate
      x-implementation-status: planned
      description: 'Bearer JWT and current ACTIVE account required. Recheck database-backed project membership and
        per-record authority on every call; system ADMIN alone grants no private-project access. All mutations require
        non-archived project. Unknown/cross-project/non-disclosable IDs return 404; authenticated insufficient capability
        returns 403. Authorization: Current project participant (MANAGER, MEMBER, VIEWER); Viewer receives only whitelisted
        client-safe fields.  Unpublished by default. Manager must explicitly approve the exact milestone fields or
        client-safe aggregate snapshot for publication; mere internal existence/completion or project membership never
        publishes data. M2 owns publication authorization and Viewer projection; M3 supplies only sanitized approved
        aggregate inputs. Approval persistence, endpoint, revocation and snapshot freshness are a planned contract
        decision, not an implemented feature. Until a reviewed approval mechanism exists, return no milestones and
        null progress/status, never internal fallbacks. Internal tasks/bugs, assignees/team, technical notes, private

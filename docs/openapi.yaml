openapi: 3.0.3
info:
  title: Project & Work Management API - Module 1
  version: 0.2.0
  description: |
    Proposed, contract-first API for the initial Authentication, Users, and
    Notifications milestone. Users Step 5B Part 1 implements GET/PUT /users/me and
    GET /admin/users and /admin/users/{userId}. Part 2 implements PATCH
    /admin/users/{userId}/approve, /reject and /status on feature/users-admin-actions.
    Auth registration, login and password-reset endpoints are implemented in main,
    not by Users Step 5B. Auth and Notifications email code are integrated.
    Other Users/Notifications operations remain planned.
    Auth-owned operation definitions below remain draft contracts; see
    docs/api-contract.md for the existing password-reset path mismatch.

    Milestone design and draft future scope (not all implemented):
    - Spring Boot API and Blazor WebAssembly frontend.
    - JWT Bearer access tokens (not cookie-based sessions).
    - Public self-registration with first name, last name, email, phone number,
      and password. Accounts begin as PENDING_APPROVAL with system role USER.
    - Administrator approval/rejection/block/unblock endpoints are implemented.
      Organization-level permission grants such as PROJECT_CREATE remain planned.
    - Updated main SecurityConfig allows PENDING_APPROVAL users to GET and PUT
      /users/me. /api/v1/notifications/** requires STATUS_ACTIVE; pending users
      cannot access notifications. Administrator routes require ROLE_ADMIN and
      STATUS_ACTIVE.
    - ADMIN is a system-level role; project Manager/Member/Viewer roles will be
      implemented later as project-specific memberships.
    - Future additional permissions are planned as strings, not boolean flags.

    Automated tests:
    - Updated main Auth requires EmailNotificationService, and shared configuration
      includes the email profile. Tests must mock email delivery and never use live
      SMTP. Do not rely on an absent email profile to prevent delivery.
    - See docs/users-rest-endpoints.md for the mocked-transport test setup.

    Security and production notes:
    - Bootstrap the first administrator through a secure, one-time setup;
      public registration must NEVER permit choosing ADMIN.
    - Enforce permissions in Spring Boot, not only in Blazor.
    - Use short-lived, signed JWTs; validate signature, issuer, audience, expiry
      and account status on protected operations. Blocking or rejecting an
      account must invalidate its effective access promptly (for example via
      a server-side status check or a token-version/revocation mechanism).
    - In a browser client, avoid persisting long-lived access tokens in
      localStorage. Prevent XSS, use HTTPS and apply rate limits.
    - Before public production rollout, implement email ownership verification,
      secure password recovery, abuse protection and an appropriate JWT logout
      / revocation or refresh-token strategy.
    - Notification delivery is best effort: failure to deliver an email should
      not roll back an otherwise successful registration or approval.

servers:
  - url: http://localhost:8080/api/v1
    description: Local Spring Boot server

tags:
  - name: Authentication
    description: Public registration and JWT authentication.
  - name: Users
    description: Authenticated users' own profile.
  - name: Administration
    description: Administrator-only user management and access grants.
  - name: Notifications
    description: Notifications belonging to the authenticated user.

# Bearer authentication applies by default. Public endpoints explicitly opt out.
security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Public self-registration
      description: |
        Creates an account with role USER, status PENDING_APPROVAL and no
        organization-level permissions. Registration does NOT issue a JWT.
        An admin can see the account in the pending registrations list.
        Email verification/activation delivery is a separate production feature.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Account created; awaiting administrator approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Authenticate with email and password
      description: |
        Returns a short-lived JWT Bearer access token for ACTIVE users.
        PENDING_APPROVAL users can also receive a token but may only GET and PUT
        /users/me under updated main SecurityConfig. Notification access requires
        STATUS_ACTIVE; pending accounts cannot access notifications.
        REJECTED and BLOCKED accounts cannot obtain new access tokens.
        The response user record helps Blazor select the correct dashboard;
        the backend remains authoritative for every access decision.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; permissions depend on account status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Incorrect email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Account is BLOCKED or REJECTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutUser
      summary: Revoke the presented JWT access token
      x-implementation-phase: later
      description: |
        Planned server-side logout. To honor this contract, the backend MUST
        actually invalidate the presented JWT (e.g. by storing its jti in a
        denylist until expiration). Simply deleting a JWT in the browser does
        NOT invalidate it. If token revocation is not implemented in the first
        milestone, keep this endpoint unimplemented and have the frontend
        discard its in-memory token on logout; never claim server revocation.
      responses:
        '204':
          description: The presented access token has been revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password-reset/request:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request password reset code
      description: |
        Generates a 6-digit numeric reset code valid for 15 minutes and
        dispatches it to the user's email.
        Always returns 200 OK to prevent email harvesting.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Request received; email dispatched if user exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/password-reset/confirm:
    post:
      tags: [Authentication]
      operationId: confirmPasswordReset
      summary: Confirm password reset with email code
      description: |
        Verifies the 6-digit code against the user's email, updates the stored
        password hash, and invalidates the code upon success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordConfirmRequest'
      responses:
        '200':
          description: Password reset successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or expired reset code, or password rules violated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/me:
    get:
      tags: [Users]
      x-implementation-status: implemented-users-step-5b-part-1
      operationId: getMyProfile
      summary: Get my account and profile
      description: |
        Available to authenticated ACTIVE and PENDING_APPROVAL users.
        Identity comes from WorkSyncPrincipal, never a query/body user ID.
        BLOCKED/REJECTED tokens receive 401 under the existing Auth filter.
      responses:
        '200':
          description: The authenticated user's safe account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      x-implementation-status: implemented-users-step-5b-part-1
      operationId: updateMyProfile
      summary: Update my basic profile
      description: |
        Users may edit their name and phone number, but not their role, account
        status, permission grants, or email via this endpoint. Email changes
        require a separate verification process in a later milestone.
        Available to authenticated ACTIVE and PENDING_APPROVAL users.
        Identity comes from WorkSyncPrincipal. Unknown JSON properties are rejected.
        BLOCKED/REJECTED tokens receive 401 under the existing Auth filter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyProfileRequest'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users:
    get:
      tags: [Administration]
      x-required-role: ADMIN
      x-implementation-status: implemented-users-step-5b-part-1
      operationId: listUsersForAdmin
      summary: List users, including pending registrations
      description: |
        ACTIVE ADMIN required. Paginated; ordered by createdAt DESC, id DESC.
        Authenticated USER or pending ADMIN receives 403.
        BLOCKED/REJECTED tokens receive 401 under the existing Auth filter.
      parameters:
        - name: status
          in: query
          required: false
          description: Optional account status filter.
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Matching user accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUsers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}:
    get:
      tags: [Administration]
      x-required-role: ADMIN
      x-implementation-status: implemented-users-step-5b-part-1
      operationId: getUserForAdmin
      summary: Retrieve an account for administration
      description: |
        ACTIVE ADMIN required. Authenticated USER or pending ADMIN receives 403.
        BLOCKED/REJECTED tokens receive 401 under the existing Auth filter.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User account found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{userId}/approve:
    patch:
      tags: [Administration]
      x-required-role: ADMIN
      x-implementation-status: implemented-users-step-5b-part-2
      operationId: approveUser
      summary: Approve a pending registration
      description: |
        ACTIVE ADMIN only. Permitted transition: PENDING_APPROVAL -> ACTIVE.
        Does not automatically grant PROJECT_CREATE or any project membership.
        No notification or permission grant is created.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invalid account transition or protected administrator operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/users/{userId}/reject:
    patch:
      tags: [Administration]
      x-required-role: ADMIN
      x-implementation-status: implemented-users-step-5b-part-2
      operationId: rejectUser
      summary: Reject a pending registration
      description: |
        ACTIVE ADMIN only. Permitted transition: PENDING_APPROVAL -> REJECTED.
        Rejected accounts are denied login. Optional reason is validated only;
        it is not persisted, logged or delivered. Unknown JSON fields are rejected.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Registration rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invalid account transition or protected administrator operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/users/{userId}/status:
    patch:
      tags: [Administration]
      x-required-role: ADMIN
      x-implementation-status: implemented-users-step-5b-part-2
      operationId: changeUserBlockStatus
      summary: Block or unblock an existing active account
      description: |
        ACTIVE ADMIN only. Supported transitions: ACTIVE -> BLOCKED and
        BLOCKED -> ACTIVE. This endpoint is not a shortcut for approving
        PENDING_APPROVAL or REJECTED users. Prevent self-blocking and protect
        the last ACTIVE ADMIN using a transaction-level PostgreSQL lock.
        Actor identity comes from WorkSyncPrincipal and is rechecked in the service.
        Optional reason is validated only, not persisted, logged or delivered.
        No audit trail is implemented in this step.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAccountStatusRequest'
      responses:
        '200':
          description: Account status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invalid account transition or protected administrator operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admin/users/{userId}/permissions:
    patch:
      tags: [Administration]
      x-required-role: ADMIN
      x-implementation-status: planned
      operationId: updateUserPermissions
      summary: Set additional organization-level permissions
      x-implementation-phase: later
      description: |
        ADMIN only. Replaces the complete collection of direct, additional
        organization-level permissions for this user. Initially the only
        planned grant is PROJECT_CREATE. Project-specific Manager/Member/Viewer
        roles will be managed by project membership in a later module.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionsRequest'
      responses:
        '200':
          description: Permission grants updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{userId}/role:
    patch:
      tags: [Administration]
      x-required-role: ADMIN
      x-implementation-status: planned
      operationId: updateUserSystemRole
      summary: Assign an organization-level role
      x-implementation-phase: later
      description: |
        Sensitive administrative operation. Only an authorized high-trust
        administrator should be allowed to promote another user to ADMIN;
        enforce appropriate policy, audit changes and prevent removal of the
        final administrator. Never accept system roles on public registration
        or in /users/me profile updates.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSystemRoleRequest'
      responses:
        '200':
          description: System role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Promotion/demotion would violate administrator policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /notifications:
    get:
      tags: [Notifications]
      x-implementation-status: planned
      operationId: getMyNotifications
      summary: Get my in-app notifications
      description: |
        Planned endpoint: requires STATUS_ACTIVE and returns notifications ONLY
        for the authenticated user. PENDING_APPROVAL accounts cannot access it,
        including account-related notifications.
        Admins may also receive notifications for new registrations.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: The authenticated user's notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedNotifications'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      x-implementation-status: planned
      operationId: markMyNotificationRead
      summary: Mark one of my notifications as read
      description: |
        Planned endpoint: requires STATUS_ACTIVE; PENDING_APPROVAL accounts
        cannot access it. The notification must belong to the authenticated user.
        Another user's notification must never be modified, even if its ID is known.
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: The updated notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Notification is missing or is not owned by this user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A signed, short-lived access token, sent as Authorization: Bearer <JWT>.
        The API must verify signature, issuer, audience, expiration, and
        effective user permissions/status. Never use the ID token as an API token.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        example: 'usr_101'
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        example: 'ntf_501'

  responses:
    BadRequest:
      description: Invalid input or malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication is required or the access token is invalid/expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: The authenticated user lacks permission for this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Requested resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidStatusTransition:
      description: Operation is not valid for the account's current status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Request rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, phoneNumber, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
          example: Jane
        lastName:
          type: string
          minLength: 1
          maxLength: 80
          example: Doe
        email:
          type: string
          format: email
          maxLength: 254
          example: jane.doe@example.com
        phoneNumber:
          type: string
          description: International E.164 format; store normalized value.
          pattern: '^\+[1-9]\d{1,14}$'
          example: '+254712345678'
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Never log, return, or persist the cleartext password.
          example: 'A-long-example-password-123!'

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: jane.doe@example.com
        password:
          type: string
          format: password
          writeOnly: true
          example: 'A-long-example-password-123!'

    UpdateMyProfileRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, phoneNumber]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
          example: Jane
        lastName:
          type: string
          minLength: 1
          maxLength: 80
          example: Doe
        phoneNumber:
          type: string
          pattern: '^\+[1-9]\d{1,14}$'
          example: '+254712345678'

    AccountStatus:
      type: string
      description: |
        PENDING_APPROVAL -> ACTIVE or REJECTED;
        ACTIVE <-> BLOCKED. Other transitions require separate policies.
      enum: [PENDING_APPROVAL, ACTIVE, REJECTED, BLOCKED]
      example: PENDING_APPROVAL

    SystemRole:
      type: string
      description: Organization-level role; project roles are separate and later.
      enum: [USER, ADMIN]
      example: USER

    OrganizationPermission:
      type: string
      description: Additional, explicitly granted organization-level capability.
      enum: [PROJECT_CREATE]
      example: PROJECT_CREATE

    UserResponse:
      type: object
      description: Safe public/admin representation. Never contains password hashes.
      required: [id, firstName, lastName, email, phoneNumber, role, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        phoneNumber:
          type: string
          example: '+254712345678'
        role:
          $ref: '#/components/schemas/SystemRole'
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-10T08:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-10T08:30:00Z'

    UserRecord:
      type: object
      description: Safe public/admin representation. Never contains password hashes.
      required: [id, firstName, lastName, email, phoneNumber, role, status, permissions, createdAt]
      properties:
        id:
          type: string
          example: 'usr_101'
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        phoneNumber:
          type: string
          example: '+254712345678'
        role:
          $ref: '#/components/schemas/SystemRole'
        status:
          $ref: '#/components/schemas/AccountStatus'
        permissions:
          type: array
          uniqueItems: true
          description: Extra organization-level permissions; not project roles.
          items:
            $ref: '#/components/schemas/OrganizationPermission'
          example: []
        createdAt:
          type: string
          format: date-time
          example: '2026-11-10T08:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-10T08:30:00Z'

    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: Signed JWT access token.
          example: 'eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...'
        tokenType:
          type: string
          enum: [Bearer]
          example: Bearer
        expiresIn:
          type: integer
          format: int32
          minimum: 1
          description: Access-token lifetime in seconds.
          example: 900
        user:
          $ref: '#/components/schemas/UserRecord'

    PagedUsers:
      type: object
      description: Stable Users list envelope; represented by UserPageResponse in Java.
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalElements:
          type: integer
          format: int64
          minimum: 0
          example: 48

    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
          example: 'Registration could not be approved.'

    ChangeAccountStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
          example: BLOCKED
        reason:
          type: string
          maxLength: 500
          example: 'Administrative security decision.'

    UpdatePermissionsRequest:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OrganizationPermission'
          example: [PROJECT_CREATE]

    UpdateSystemRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/SystemRole'

    NotificationStatus:
      type: string
      enum: [READ, UNREAD]
      example: UNREAD

    NotificationType:
      type: string
      enum: [ACCOUNT_REGISTERED, ACCOUNT_APPROVED, ACCOUNT_REJECTED, ACCOUNT_BLOCKED, GENERAL]
      example: ACCOUNT_APPROVED

    NotificationRecord:
      type: object
      required: [id, type, title, message, status, createdAt]
      properties:
        id:
          type: string
          example: 'ntf_501'
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
          example: 'Account approved'
        message:
          type: string
          example: 'Your account has been approved. You can now use the platform.'
        status:
          $ref: '#/components/schemas/NotificationStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-10T08:31:00Z'
        readAt:
          type: string
          format: date-time
          nullable: true
          example: null

    PagedNotifications:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/NotificationRecord'
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          example: 20
        totalElements:
          type: integer
          format: int64
          minimum: 0
          example: 3

    ApiError:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          example: ACCOUNT_PENDING_APPROVAL
        message:
          type: string
          example: 'Your account does not have permission to perform this action.'
        timestamp:
          type: string
          format: date-time
          example: '2026-11-10T08:35:00Z'
        fieldErrors:
          type: array
          description: Optional field validation details; never include passwords.
          items:
            $ref: '#/components/schemas/FieldError'
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: jane.doe@example.com

    ResetPasswordConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, resetCode, newPassword]
      properties:
        email:
          type: string
          format: email
          example: jane.doe@example.com
        resetCode:
          type: string
          pattern: '^\d{6}$'
          minLength: 6
          maxLength: 6
          description: 6-digit numeric verification code sent to the email.
          example: '583921'
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: New password meeting length constraints.
          example: 'A-long-example-password-123!'

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: 'If an account with this email exists, a password reset code has been sent.'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: phoneNumber
        message:
          type: string
          example: 'Must use international format, e.g. +254712345678.'

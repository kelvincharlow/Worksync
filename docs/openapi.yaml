      - type: object
        additionalProperties: false
        properties:
          outcome:
            type: string
            enum:
            - DUPLICATE
          priority:
            $ref: '#/components/schemas/WorkItemPriority'
          reason:
            type: string
            minLength: 1
            pattern: .*\S.*
          duplicateOfBugId:
            type: string
            format: uuid
        required:
        - outcome
        - reason
        - duplicateOfBugId
      description: 'BEGIN_TRIAGE: REPORTED -> TRIAGE. ACCEPT: TRIAGE or REOPENED -> ASSIGNED with eligible ACTIVE fixer;
        record ACCEPTED outcome. INVALID/DUPLICATE: REPORTED or TRIAGE -> CLOSED with corresponding triage outcome and
        nonblank reason, no verification PASS. DUPLICATE requires another BUG in same project and no self/duplicate
        cycle. No other transitions. Outcome request action BEGIN_TRIAGE is not a persisted triage disposition. Persist
        triageOutcome, triageReason and duplicateOfBugId as the current BUG triage decision in Work Items, atomically
        with the lifecycle operation and append-only history. Before triage all three are null; BEGIN_TRIAGE alone does
        not set a disposition. ACCEPT records ACCEPTED; its reason may be null. INVALID/DUPLICATE require a nonblank
        reason. duplicateOfBugId is populated only for DUPLICATE, otherwise null; it must identify a different Work
        Item of type BUG in the same project, never self, another type or another project, and must not create duplicate
        cycles. Validate through project-scoped lookup; do not infer permission from a reference. History records the
        decision fields as an immutable event snapshot with actor/time/state; later changes never overwrite prior history.
        Exact persistence mapping and migration version remain foundation implementation decisions, not schema changes
        in this documentation PR.'

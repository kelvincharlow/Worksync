        verifierUserId:
          type: string
          format: uuid
      required:
      - verifierUserId
      description: Eligible ACTIVE project MEMBER/MANAGER only, never VIEWER. Manager may designate an independent non-QA
        contributor when necessary for this bug only; Technical Lead may select QA_TESTER only. Candidate cannot be
        fixer or fix submitter. Allowed while ASSIGNED/IN_PROGRESS/REOPENED; READY_FOR_VERIFICATION reassignment rejected
        with 409 to preserve pending attempt identity. Record history; recheck current eligibility before verification.
    SubmitBugFixRequest:
      type: object
      additionalProperties: false
      properties:
        summary:
          type: string
          minLength: 1
          pattern: .*\S.*
        reference:
          type: string
          maxLength: 500
      required:
      - summary
      description: Assigned ACTIVE fixer only, IN_PROGRESS -> READY_FOR_VERIFICATION; eligible independent verifier
        already designated. Preserve fix submitter identity for this attempt. Without eligible verifier return 409 and
        retain IN_PROGRESS. Summary required; optional reference is plain text, not attachment/upload/fetched URL. Append
        submission history.

          format: uuid
          nullable: true
          description: 'Persisted duplicate target: a different BUG Work Item in this project. Populated for DUPLICATE
            only; otherwise null. History preserves the target recorded for that triage event.'
      required:
      - id
      - bugId
      - actorUserId
      - action
      - toStatus
      - createdAt
      - triageOutcome
      - triageReason
      - duplicateOfBugId
      description: 'Append-only events: REPORT, triage, assignment, verifier designation, START_WORK, SUBMIT_FIX, VERIFIED/FAILED_VERIFICATION,
        REOPEN. Keep past fix submitter/verifier identities; changing assignment must not enable verifying one''s own

        per-record authority on every call; system ADMIN alone grants no private-project access. All mutations require
        non-archived project. Unknown/cross-project/non-disclosable IDs return 404; authenticated insufficient capability
        returns 403. Authorization: Explicitly designated ACTIVE eligible verifier only; fixer/fix submitter cannot
        verify their own fix, even if MANAGER. Only designated eligible ACTIVE project MEMBER/MANAGER, never VIEWER
        or fixer/fix submitter of this attempt. READY_FOR_VERIFICATION only: PASS -> CLOSED, FAIL -> REOPENED. Atomically
        record immutable attempt, actor, timestamp, notes and VERIFIED/FAILED_VERIFICATION plus reopening history.
        Concurrent/repeated consumption of same attempt returns 409. Caller role alone never grants verification.'
      security:

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A signed, short-lived access token, sent as Authorization: Bearer <JWT>.
        The API must verify signature, issuer, audience, expiration, and
        effective user permissions/status. Never use the ID token as an API token.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        example: 'usr_101'
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        example: 'ntf_501'

    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MilestoneId:
      name: milestoneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BugId:
      name: bugId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    M2M3Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    M2M3Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid input or malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication is required or the access token is invalid/expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: The authenticated user lacks permission for this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Requested resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidStatusTransition:
      description: Operation is not valid for the account's current status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Request rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    M2M3Conflict:
      description: Project archived, duplicate membership/link, ownership invariant, invalid lifecycle/assignment/verifier
        or competing transition. Return a safe code/message/timestamp; never SQL or internal exceptions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, email, phoneNumber, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
          example: Jane
        lastName:
          type: string
          minLength: 1
          maxLength: 80
          example: Doe
        email:
          type: string
          format: email
          maxLength: 254
          example: jane.doe@example.com
        phoneNumber:
          type: string
          description: International E.164 format; store normalized value.
          pattern: '^\+[1-9]\d{1,14}$'
          example: '+254712345678'
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Never log, return, or persist the cleartext password.
          example: 'A-long-example-password-123!'

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: jane.doe@example.com
        password:
          type: string
          format: password
          writeOnly: true
          example: 'A-long-example-password-123!'

    UpdateMyProfileRequest:
      type: object
      additionalProperties: false
      required: [firstName, lastName, phoneNumber]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 80
          example: Jane
        lastName:
          type: string
          minLength: 1
          maxLength: 80
          example: Doe
        phoneNumber:
          type: string
          pattern: '^\+[1-9]\d{1,14}$'
          example: '+254712345678'

    AccountStatus:
      type: string
      description: |
        PENDING_APPROVAL -> ACTIVE or REJECTED;
        ACTIVE <-> BLOCKED. Other transitions require separate policies.
      enum: [PENDING_APPROVAL, ACTIVE, REJECTED, BLOCKED]
      example: PENDING_APPROVAL

    SystemRole:
      type: string
      description: Organization-level role; project roles are separate and later.
      enum: [USER, ADMIN]
      example: USER

    OrganizationPermission:
      type: string
      description: Additional, explicitly granted organization-level capability.
      enum: [PROJECT_CREATE]
      example: PROJECT_CREATE

    UserResponse:
      type: object
      description: Safe public/admin representation. Never contains password hashes.
      required:
      - id
      - firstName
      - lastName
      - email
      - phoneNumber
      - role
      - status
      - createdAt
      - updatedAt
      - permissions
      - effectivePermissions
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        phoneNumber:
          type: string
          example: '+254712345678'
        role:
          $ref: '#/components/schemas/SystemRole'
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-10T08:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-10T08:30:00Z'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OrganizationPermission'
          description: Directly stored organization grants; may remain stored on an inactive account. Not authorization
            for a write.
        effectivePermissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OrganizationPermission'
          readOnly: true
          description: Stored grants only while status is ACTIVE; otherwise empty. Display snapshot only; future writes
            recheck current database state under the Users lock.

    UserRecord:
      type: object
      description: Safe public/admin representation. Never contains password hashes.
      required:
      - id
      - firstName
      - lastName
      - email
      - phoneNumber
      - role
      - status
      - permissions
      - createdAt
      properties:
        id:
          type: string
          example: usr_101
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        phoneNumber:
          type: string
          example: '+254712345678'
        role:
          $ref: '#/components/schemas/SystemRole'
        status:
          $ref: '#/components/schemas/AccountStatus'
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OrganizationPermission'
          description: Directly stored organization grants; may remain stored on an inactive account. Not authorization
            for a write.
        createdAt:
          type: string
          format: date-time
          example: '2026-11-10T08:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-10T08:30:00Z'
        effectivePermissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OrganizationPermission'
          readOnly: true
          description: Stored grants only while status is ACTIVE; otherwise empty. Display snapshot only; future writes
            recheck current database state under the Users lock.

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: Signed JWT access token.
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        refreshToken:
          type: string
          description: Opaque, single-use refresh token.
          example: 'x8K2L_9aP0...'
        tokenType:
          type: string
          enum: [Bearer]
          example: Bearer
        expiresIn:
          type: integer
          format: int32
          minimum: 1
          description: Access-token lifetime in seconds.
          example: 900
        user:
          $ref: '#/components/schemas/UserRecord'

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: The single-use refresh token string.
          example: 'x8K2L_9aP0...'

    PagedUsers:
      type: object
      description: Stable Users list envelope; represented by UserPageResponse in Java.
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalElements:
          type: integer
          format: int64
          minimum: 0
          example: 48

    ReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
          example: 'Registration could not be approved.'

    ChangeAccountStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, BLOCKED]
          example: BLOCKED
        reason:
          type: string
          maxLength: 500
          example: 'Administrative security decision.'

    UpdatePermissionsRequest:
      type: object
      additionalProperties: false
      required:
      - permissions
      properties:
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/OrganizationPermission'
          example:
          - PROJECT_CREATE
      description: Complete replacement. Required non-null collection of supported names; no nulls, duplicate values
        or unknown properties. Empty array revokes all grants.

    UpdateSystemRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/SystemRole'

    NotificationStatus:
      type: string
      enum: [READ, UNREAD]
      example: UNREAD

    NotificationType:
      type: string
      enum: [ACCOUNT_REGISTERED, ACCOUNT_APPROVED, ACCOUNT_REJECTED, ACCOUNT_BLOCKED, GENERAL]
      example: ACCOUNT_APPROVED

    NotificationRecord:
      type: object
      required: [id, type, title, message, status, createdAt]
      properties:
        id:
          type: string
          example: 'ntf_501'
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
          example: 'Account approved'
        message:
          type: string
          example: 'Your account has been approved. You can now use the platform.'
        status:
          $ref: '#/components/schemas/NotificationStatus'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-10T08:31:00Z'
        readAt:
          type: string
          format: date-time
          nullable: true
          example: null

    PagedNotifications:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/NotificationRecord'
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          example: 20
        totalElements:
          type: integer
          format: int64
          minimum: 0
          example: 3

    ApiError:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          example: ACCOUNT_PENDING_APPROVAL
        message:
          type: string
          example: 'Your account does not have permission to perform this action.'
        timestamp:
          type: string
          format: date-time
          example: '2026-11-10T08:35:00Z'
        fieldErrors:
          type: array
          description: Optional field validation details; never include passwords.
          items:
            $ref: '#/components/schemas/FieldError'
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: jane.doe@example.com

    ResetPasswordConfirmRequest:
      type: object
      additionalProperties: false
      required: [email, resetCode, newPassword]
      properties:
        email:
          type: string
          format: email
          example: jane.doe@example.com
        resetCode:
          type: string
          pattern: '^\d{6}$'
          minLength: 6
          maxLength: 6
          description: 6-digit numeric verification code sent to the email.
          example: '583921'
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: New password meeting length constraints.
          example: 'A-long-example-password-123!'

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: 'If an account with this email exists, a password reset code has been sent.'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: phoneNumber
        message:
          type: string
          example: 'Must use international format, e.g. +254712345678.'

    ProjectRole:
      type: string
      enum:
      - MANAGER
      - MEMBER
      - VIEWER
    ProjectResponsibility:
      type: string
      enum:
      - TECHNICAL_LEAD
      - DEVELOPER
      - QA_TESTER
    ProjectStatus:
      type: string
      enum:
      - ACTIVE
      - ARCHIVED
    WorkItemType:
      type: string
      enum:
      - EPIC
      - STORY
      - TASK
      - BUG
    WorkItemStatus:
      type: string
      enum:
      - TODO
      - IN_PROGRESS
      - IN_REVIEW
      - DONE
      description: 'Initial ordinary EPIC/STORY/TASK statuses: TODO, IN_PROGRESS, IN_REVIEW, DONE. Never used for BUG
        lifecycle. Detailed ordinary-work transition/field permissions remain a foundation review decision.'
    WorkItemPriority:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      x-contract-decision: proposed-pending-review
      description: Proposed first-release urgency bands; URGENT is deferred pending agreement.
    BugSeverity:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
      x-contract-decision: proposed-pending-review
      description: Proposed impact bands, independent of fix urgency/priority; confirm definitions before implementation.
    WorkItemLinkType:
      type: string
      enum:
      - RELATES_TO
      - BLOCKS
      x-contract-decision: proposed-pending-review
      description: Proposed link whitelist. BLOCKS is directional and must not introduce dependency cycles. RELATES_TO
        is symmetric and deduplicated.
    BugStatus:
      type: string
      enum:
      - REPORTED
      - TRIAGE
      - ASSIGNED
      - IN_PROGRESS
      - READY_FOR_VERIFICATION
      - REOPENED
      - CLOSED
      description: Fixed workflow. PASS/FAIL are verification results, INVALID/DUPLICATE are triage outcomes, never
        statuses. CLOSED represents successful PASS closure or an explicitly reasoned INVALID/DUPLICATE triage disposition;
        triage closure is not a verified fix.
      x-permitted-transitions:
      - from: REPORTED
        action: BEGIN_TRIAGE
        to: TRIAGE
        actor: MANAGER or TECHNICAL_LEAD
      - from: TRIAGE
        action: ACCEPT
        to: ASSIGNED
        actor: MANAGER or TECHNICAL_LEAD
      - from: REOPENED
        action: ACCEPT or ASSIGN
        to: ASSIGNED
        actor: MANAGER or TECHNICAL_LEAD
      - from: ASSIGNED
        action: START_WORK
        to: IN_PROGRESS
        actor: Assigned fixer
      - from: IN_PROGRESS
        action: SUBMIT_FIX
        to: READY_FOR_VERIFICATION
        actor: Assigned fixer; independent verifier designated
      - from: READY_FOR_VERIFICATION
        action: PASS
        to: CLOSED
        actor: Designated independent verifier
      - from: READY_FOR_VERIFICATION
        action: FAIL
        to: REOPENED
        actor: Designated independent verifier
      - from: REPORTED
        action: INVALID or DUPLICATE
        to: CLOSED
        actor: MANAGER or TECHNICAL_LEAD; reason required
      - from: TRIAGE
        action: INVALID or DUPLICATE
        to: CLOSED
        actor: MANAGER or TECHNICAL_LEAD; reason required
      - from: IN_PROGRESS
        action: CHANGE_FIXER
        to: ASSIGNED
        actor: MANAGER or TECHNICAL_LEAD
    VerificationResult:
      type: string
      enum:
      - PASS

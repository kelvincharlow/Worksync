          - INVALID
          - DUPLICATE
          - null
          description: ACCEPTED, INVALID or DUPLICATE; null before a disposition. In history, null for events without
            a triage decision.
        triageReason:
          type: string
          nullable: true
          description: Persisted explanation; null when absent/before triage. Nonblank for INVALID/DUPLICATE. History
            contains the explanation recorded for that event.
        duplicateOfBugId:
          type: string
          format: uuid
          nullable: true
          description: 'Persisted duplicate target: a different BUG Work Item in this project. Populated for DUPLICATE
            only; otherwise null. History preserves the target recorded for that triage event.'
      required:
      - id
      - projectId
      - type
      - title
      - description
      - reporterUserId
      - fixerUserId
      - verifierUserId
      - status
      - severity
      - priority
      - reproductionSteps
      - expectedResult
      - actualResult
      - latestVerificationResult
      - createdAt
      - updatedAt
      - triageOutcome
      - triageReason
      - duplicateOfBugId
      description: 'A specialized Work Item: id is the shared work-item UUID, not a separate bug identifier. Generic
        Work Items operations cannot mutate this status; use bug operations. Persist triageOutcome, triageReason and
        duplicateOfBugId as the current BUG triage decision in Work Items, atomically with the lifecycle operation and
        append-only history. Before triage all three are null; BEGIN_TRIAGE alone does not set a disposition. ACCEPT
        records ACCEPTED; its reason may be null. INVALID/DUPLICATE require a nonblank reason. duplicateOfBugId is populated
        only for DUPLICATE, otherwise null; it must identify a different Work Item of type BUG in the same project,
        never self, another type or another project, and must not create duplicate cycles. Validate through project-scoped
        lookup; do not infer permission from a reference. History records the decision fields as an immutable event
        snapshot with actor/time/state; later changes never overwrite prior history. Exact persistence mapping and migration
        version remain foundation implementation decisions, not schema changes in this documentation PR.'
